<app-file-downloader-header
    [selectedRows]="selectedRows()"
    [rows]="rows()"
    [isLoading]="isLoading()"
    (selectAllClicked)="onSelectAllClicked($event)"
    (downloadSelectedClicked)="onDownloadSelectedClicked($event)"
></app-file-downloader-header>
<app-file-downloader-table
    [colDef]="colDef()"
    [rows]="rows()"
    [selectAll]="selectAll()"
    [isLoading]="isLoading()"
    (selectedRowsChanged)="onSelectedRowsChanged($event)"
></app-file-downloader-table>
